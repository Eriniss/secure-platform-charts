apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.gitlab.io
      chart: gitlab
      targetRevision: 10.2.1   # helm search repo gitlab/gitlab --versions로 최신 확인
      helm:
        valueFiles:
          - $values/gitlab/values/gitlab.yaml
    - repoURL: git@github.com:Eriniss/secure-platform-charts.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]