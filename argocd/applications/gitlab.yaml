apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Eriniss/secure-platform-charts.git
    targetRevision: main
    path: gitlab/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]