apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-shared-read"
          serviceAccountRef:
            name: "external-secrets"       # 위에서 확인한 실제 이름
            namespace: "external-secrets"