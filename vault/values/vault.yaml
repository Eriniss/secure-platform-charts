global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false

server:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: openebs-lvm-thin
    accessMode: ReadWriteOnce

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "raft" {
        path = "/vault/data"
      }
