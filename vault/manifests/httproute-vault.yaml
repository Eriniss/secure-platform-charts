apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - "vault.polipixel.link"
  rules:
    - backendRefs:
        - name: vault
          port: 8200