apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "harbor.polipixel.link"
  rules:
    - backendRefs:
        - name: harbor
          port: 80