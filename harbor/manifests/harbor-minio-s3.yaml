apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-minio-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-minio-s3
    creationPolicy: Owner
  data:
    - secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
      remoteRef:
        key: secret/data/harbor/minio
        property: accesskey
    - secretKey: REGISTRY_STORAGE_S3_SECRETKEY
      remoteRef:
        key: secret/data/harbor/minio
        property: secretkey