apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: todos-db
  namespace: db-app
spec:
  description: "todos-db: backend만 5432, operator 8000, 인스턴스 간 통신 / egress는 DNS, kube-apiserver, 인스턴스 간, MinIO(백업)"
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: todos-db
  ingress:
    # backend -> postgres
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": back-app
            app: todos-back
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # CNPG operator -> instance manager status
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # 같은 클러스터 인스턴스 간 (복제 5432, 상태 8000)
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: todos-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    # DNS (+ Hubble 에서 FQDN 가시화, toFQDNs 의 전제 조건)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # instance manager / 플러그인 사이드카 -> kube-apiserver
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 인스턴스 간
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: todos-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # 백업/WAL 아카이브 -> MinIO (평문 HTTP 9000). Hubble DROPPED 로 확인한 목적지.
    - toFQDNs:
        - matchName: minio.polipixel.link
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP