apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: todos-db
  namespace: db-app
spec:
  description: "todos-db: backend만 5432, operator 8000, 인스턴스 간 통신 / egress는 DNS, kube-apiserver, 인스턴스 간"
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: todos-db
  ingress:
    # backend -> postgres
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": back-app
            app: todos-back
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # CNPG operator -> instance manager status
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # 같은 클러스터 인스턴스 간 (복제 5432, 상태 8000). 현재 1 인스턴스라 지금은 트래픽 없음, 스케일 대비.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: todos-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    # DNS (+ Hubble 에서 FQDN 가시화)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # instance manager -> kube-apiserver (RKE2: 6443). audit 에서 dst port 가 다르게 보이면 조정.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 인스턴스 간
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: todos-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
