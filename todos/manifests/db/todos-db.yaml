apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: todos-db
  namespace: db-app
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: todos
      owner: todos
      secret:
        name: todos-db-auth
  storage:
    size: 2Gi
    storageClass: openebs-lvm-thin
