apiVersion: v1
kind: Service
metadata:
  name: {{ include "logto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # HTTPRoute/Ingress의 backendRefs.port(또는 servicePort)는 아래 core/admin
  # 포트(=이 Service가 노출하는 포트)를 가리켜야 합니다 - 파드의 targetPort가 아닙니다.
  ports:
    - name: core
      port: {{ .Values.service.core.port }}
      targetPort: core
      protocol: TCP
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "logto.selectorLabels" . | nindent 4 }}
