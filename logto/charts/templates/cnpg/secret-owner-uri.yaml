{{/*
공용(기존) CNPG 클러스터 경로에서 owner role Secret이 CNPG 표준 basic-auth 형식
(username/password만 있음, 예: managed.roles.passwordSecret)일 때, 이 차트가 필요로 하는
"uri" 키를 가진 Secret을 파생시켜 만듭니다.
주의: `lookup`을 사용하므로 실제 클러스터에 연결된 `helm install/upgrade`에서만 동작합니다.
(`helm template` 오프라인 렌더링에서는 원본 Secret을 찾지 못해 실패합니다.)
*/}}
{{- if and .Values.cnpg.enabled (not .Values.cnpg.cluster.create) (not .Values.externalSecret.enabled) (eq (.Values.cnpg.existingOwnerSecretFormat | default "basic-auth") "basic-auth") -}}
{{- if not .Values.cnpg.existingOwnerSecret -}}
{{- fail "cnpg.cluster.create=false 이면 cnpg.existingOwnerSecret 을 지정해야 합니다." -}}
{{- end -}}
{{- $ns := .Values.cnpg.clusterNamespace | default .Release.Namespace -}}
{{- $src := lookup "v1" "Secret" $ns .Values.cnpg.existingOwnerSecret -}}
{{- if not $src -}}
{{- fail (printf "Secret %s/%s 을 찾을 수 없습니다 (cnpg.existingOwnerSecret). 공용 CNPG 클러스터 쪽에 managed.roles로 먼저 만들어졌는지 확인하세요." $ns .Values.cnpg.existingOwnerSecret) -}}
{{- end -}}
{{- $userKey := .Values.cnpg.existingOwnerSecretUserKey | default "username" -}}
{{- $passKey := .Values.cnpg.existingOwnerSecretPasswordKey | default "password" -}}
{{- $user := index $src.data $userKey | b64dec -}}
{{- $pass := index $src.data $passKey | b64dec -}}
{{- $host := printf "%s-rw.%s.svc.cluster.local" (include "logto.cnpgClusterName" .) $ns -}}
{{- $uri := printf "postgres://%s:%s@%s:5432/%s" $user $pass $host .Values.cnpg.database.name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logto.fullname" . }}-cnpg-owner-uri
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
    app.kubernetes.io/component: cnpg
type: Opaque
stringData:
  uri: {{ $uri | quote }}
{{- end -}}
