{{/*
Vault + External Secrets Operator 연동. externalSecret.enabled=true 이면
이 차트는 DB_URL/SECRET_VAULT_KEK 용 Secret을 직접 만들지 않고,
ExternalSecret이 SecretStore를 통해 값을 가져와 "<fullname>-external" Secret을 채웁니다.
*/}}
{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "logto.fullname" . }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "logto.fullname" . }}-external
    creationPolicy: Owner
  data:
    - secretKey: uri
      remoteRef:
        {{- toYaml .Values.externalSecret.dbUrl.remoteRef | nindent 8 }}
    - secretKey: SECRET_VAULT_KEK
      remoteRef:
        {{- toYaml .Values.externalSecret.secretVaultKek.remoteRef | nindent 8 }}
{{- end -}}
