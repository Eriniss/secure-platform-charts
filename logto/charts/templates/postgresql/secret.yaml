{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) (not .Values.externalSecret.enabled) -}}
{{- $secretName := include "logto.postgresqlFullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgresql.auth.password -}}
{{- if not $password -}}
  {{- if and $existing (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{/*
    Secret이 없는데 이전 데이터가 남은 PVC는 이미 있는 경우 (예: helm upgrade가 아니라
    helm uninstall 후 helm install로 재설치 - PVC는 Helm이 지우지 않아 그대로 남음) 여기서
    새 임의 비밀번호를 만들면, 이미 초기화된 PGDATA 안의 실제 role 비밀번호와 어긋나
    "password authentication failed"로 이어집니다. 조용히 어긋난 비밀번호를 만드는 대신
    바로 실패시켜 사용자가 알아채게 합니다.
    */}}
    {{- $pvcName := printf "data-%s-0" (include "logto.postgresqlFullname" .) -}}
    {{- $existingPvc := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $pvcName -}}
    {{- if $existingPvc -}}
      {{- fail (printf "PVC %s 는 이미 존재하는데 Secret %s 는 없습니다 - helm uninstall 후 helm install로 재설치했을 가능성이 높습니다. 이 상태로 새 임의 비밀번호를 만들면 기존 PGDATA의 실제 DB 비밀번호와 어긋납니다. postgresql.auth.password 에 원래 비밀번호를 직접 지정하거나(예: 기존 Postgres pod에 exec 해서 ALTER ROLE로 비밀번호를 재설정), 데이터를 버려도 된다면 PVC %s 를 먼저 삭제한 뒤 다시 설치하세요. 버전만 올릴 때는 uninstall/install 대신 helm upgrade를 쓰는 것을 권장합니다." $pvcName $secretName $pvcName) -}}
    {{- end -}}
{{- $password = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- $host := printf "%s.%s.svc.cluster.local" (include "logto.postgresqlFullname" .) .Release.Namespace -}}
{{- $uri := printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $password $host .Values.postgresql.auth.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
  host: {{ $host | quote }}
  port: "5432"
  uri: {{ $uri | quote }}
{{- end -}}
