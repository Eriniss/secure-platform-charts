apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
data:
  ENDPOINT: {{ .Values.logto.endpoint | quote }}
  ADMIN_ENDPOINT: {{ .Values.logto.adminEndpoint | quote }}
  PORT: {{ .Values.ports.core | quote }}
  ADMIN_PORT: {{ .Values.ports.admin | quote }}
  TRUST_PROXY_HEADER: {{ .Values.logto.trustProxyHeader | ternary "1" "0" | quote }}
  # 비대화형(headless) 실행 환경임을 CLI에 알려 DB 시드/마이그레이션이 프롬프트 없이 진행되도록 합니다.
  CI: "true"
  NODE_ENV: "production"
