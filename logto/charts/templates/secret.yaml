{{/*
logto.existingSecret 을 지정하면 KEK Secret을 만들지 않습니다 (ArgoCD 등 GitOps 환경 권장).
ArgoCD는 helm lookup을 지원하지 않아, 이 템플릿의 "기존 값 재사용" 로직이 동작하지 않고
Sync(새 커밋)마다 randBytes로 새 KEK가 생성됩니다.
*/}}
{{- if and (not .Values.externalSecret.enabled) (not .Values.logto.existingSecret) -}}
{{- $secretName := include "logto.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $kek := .Values.logto.secretVaultKEK -}}
{{- if not $kek -}}
  {{- if and $existing (hasKey $existing.data "SECRET_VAULT_KEK") -}}
{{- $kek = index $existing.data "SECRET_VAULT_KEK" | b64dec -}}
  {{- else -}}
{{- $kek = randBytes 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_VAULT_KEK: {{ $kek | quote }}
{{- end -}}
