{{- if not .Values.externalSecret.enabled -}}
{{- $secretName := include "logto.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $kek := .Values.logto.secretVaultKEK -}}
{{- if not $kek -}}
  {{- if and $existing (hasKey $existing.data "SECRET_VAULT_KEK") -}}
{{- $kek = index $existing.data "SECRET_VAULT_KEK" | b64dec -}}
  {{- else -}}
{{- $kek = randBytes 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_VAULT_KEK: {{ $kek | quote }}
{{- end -}}
