apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  namespace: gitlab
spec:
  parentRefs:
    - name: default-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "gitlab.polipixel.link"
  rules:
    - backendRefs:
        - name: gitlab-webservice-default
          port: 8181