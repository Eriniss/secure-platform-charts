apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-secret
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: gitlab-runner-secret, creationPolicy: Owner }
  data:
    - secretKey: runner-token
      remoteRef: { key: secret/data/gitlab/runner-token, property: token }
