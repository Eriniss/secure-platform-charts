apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-omniauth-openid-connect
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-omniauth-openid-connect
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        provider: |
          name: openid_connect
          label: Logto
          args:
            name: openid_connect
            scope:
              - openid
              - profile
              - email
            response_type: code
            issuer: https://logto.polipixel.link/oidc
            discovery: true
            client_auth_method: query
            uid_field: sub
            pkce: true
            client_options:
              identifier: 2lg1cgp2fccnqd9d4olia
              secret: {{ .clientSecret }}
              redirect_uri: https://gitlab.polipixel.link/users/auth/openid_connect/callback
  data:
    - secretKey: clientSecret
      remoteRef:
        key: gitlab/logto-oidc
        property: clientSecret
