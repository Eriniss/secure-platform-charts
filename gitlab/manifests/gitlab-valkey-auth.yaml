apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-valkey-auth
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: gitlab-valkey-auth, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: gitlab/valkey, property: password }