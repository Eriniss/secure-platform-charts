global:
  hosts:
    domain: polipixel.link
    https: true
  ingress:
    enabled: false
  certmanager:
    install: false

  psql:
    host: gitlab-postgres-rw.gitlab.svc
    password:
      useSecret: true
      secret: gitlab-postgres-app
      key: password

  redis:
    host: gitlab-valkey.gitlab.svc
    auth:
      enabled: true
      secret: gitlab-valkey-auth
      key: password
    kas:
      host: gitlab-valkey.gitlab.svc
      auth:
        enabled: true
        secret: gitlab-valkey-auth
        key: password

  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-storage
        key: connection
    lfs:
      bucket: gitlab-data
    uploads:
      bucket: gitlab-data
    artifacts:
      bucket: gitlab-data
    packages:
      bucket: gitlab-data
    externalDiffs:
      enabled: true
      bucket: gitlab-data
    dependencyProxy:
      enabled: true
      bucket: gitlab-data
    terraformState:
      bucket: gitlab-data
    ciSecureFiles:
      bucket: gitlab-data
    agentPlanContent:
      bucket: gitlab-data
    backups:
      bucket: gitlab-backup
      tmpBucket: gitlab-backup

  gatewayApi:
    enabled: false
    installEnvoy: false

registry:
  enabled: false

postgresql:
  install: false
redis:
  install: false
minio:
  install: false
nginx-ingress:
  enabled: false
installCertmanager: false
certmanager:
  installCRDs: false
certmanager-issuer:
  install: false
  email: jhs2195@gmail.com
prometheus:
  install: false
gitlab-runner:
  install: false
ai-gateway:
  install: false

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitaly:
    persistence:
      storageClass: openebs-lvm-thin
      size: 30Gi
  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-backup-storage
          key: config
