apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sc-default-test-pvc
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName 생략 → default StorageClass 자동 적용되는지 확인
---
apiVersion: v1
kind: Pod
metadata:
  name: sc-default-test-pod
  namespace: default
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: sc-default-test-pvc