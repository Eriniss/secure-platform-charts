apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata: {name: vault-test-snap, namespace: vault}
spec:
  volumeSnapshotClassName: openebs-lvm-snapclass
  source: {persistentVolumeClaimName: data-vault-0}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vault-test-restored, namespace: vault}
spec:
  storageClassName: openebs-lvm-thin
  dataSource: {name: vault-test-snap, kind: VolumeSnapshot, apiGroup: snapshot.storage.k8s.io}
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}          # 원본과 동일 크기
---
apiVersion: v1
kind: Pod
metadata: {name: vault-test-reader, namespace: vault}
spec:
  nodeSelector: {kubernetes.io/hostname: worker01}
  securityContext: {runAsUser: 100, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}   # Vault와 같은 UID (파일이 0600)
  containers:
  - name: c
    image: busybox
    command: ["sh","-c","ls -la /data /data/raft && sleep 3600"]
    volumeMounts: [{name: v, mountPath: /data, readOnly: true}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: vault-test-restored}}]
