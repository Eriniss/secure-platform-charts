deploymentMode: Monolithic

global:
  dnsService: rke2-coredns-rke2-coredns
  dnsNamespace: kube-system

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-09-01"
        store: tsdb
        object_store: s3
        schema: v13                   # OTLP·structured metadata의 전제 조건
        index: {prefix: loki_index_, period: 24h}
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    s3:
      endpoint: minio.polipixel.link:9000
      region: us-east-1
      accessKeyId: ${LGTM_S3_ACCESS_KEY}
      secretAccessKey: ${LGTM_S3_SECRET_KEY}
      s3ForcePathStyle: true          # MinIO는 path-style
      insecure: true
      http_config:
        insecure_skip_verify: true
  limits_config:
    allow_structured_metadata: true   # OTLP 속성이 여기에 저장됨
    volume_enabled: true
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3
  pattern_ingester:
    enabled: true                     # Grafana Logs Drilldown의 패턴 탭

singleBinary:
  replicas: 1
  extraArgs: ["-config.expand-env=true"]
  extraEnvFrom:
    - secretRef: {name: lgtm-minio}
  persistence: {size: 10Gi}

read:    {replicas: 0}
write:   {replicas: 0}
backend: {replicas: 0}

gateway:
  enabled: true                       # loki-gateway:80 — /otlp, /loki/api/v1/push 모두 이 경로로
chunksCache:  {enabled: false}
resultsCache: {enabled: false}
lokiCanary:   {enabled: false}
test:         {enabled: false}
