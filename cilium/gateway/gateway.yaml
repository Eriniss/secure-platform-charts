apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default-gateway
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.polipixel.link"
      allowedRoutes:
        namespaces:
          from: All
      tls:
       certificateRefs:
        - kind: Secret
          group: ""
          name: polipixel-tls
